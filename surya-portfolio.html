      --ff-m: 'DM Mono', monospace;
      --r: 14px;
      --rl: 20px;

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);

      font-size: 15px;

    /* Noise + ambient */

      position: fixed;
      inset: 0;

      position: fixed;
      top: -30vh; left: 50%;
      transform: translateX(-50%);
      width: 80vw; height: 60vh;
      background: radial-gradient(ellipse, rgba(0,229,160,0.04) 0%, transparent 70%);

    .tag { display: inline-flex; align-items: center; padding: 4px 10px; background: var(--tag-bg); border: 1px solid var(--tag-b); border-radius: 6px; font-family: var(--ff-m); font-size: 11px; color: var(--text2); transition: var(--t); }

  ]
};

/* ============================================================
   RENDER ENGINE
============================================================ */
function h(tag, attrs={}, ...children) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v);
  }
  children.flat(Infinity).forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

function Tag(text, accent=false) {
  return h('span', {class: 'tag' + (accent?' a':'')}, text);
}

function Nav() {
  const logo = h('a', {class:'logo', href:'#'}, DATA.meta.logo.replace('.',''), h('span', {}, '.'), 'dev');
  const links = h('ul', {}, ...DATA.meta.nav.map((n,i) => {
    const isCta = n==='Contact';
    return h('li', {}, h('a', {href:`#${n.toLowerCase()}`, ...(isCta?{class:'nav-cta'}:{})}, n));
  }));
  return h('nav', {class:'fade1'}, logo, links);
}

function Hero() {
  const { hero, contact, cards } = DATA;

  // Stats
  const stats = h('div', {class:'hstats'},
    ...hero.stats.map(s => h('div', {class:'stat'},
      h('div', {class:'sv'}, s.v),
      h('div', {class:'sl'}, s.l)
    ))
  );

  const left = h('div', {class:'hleft fade2'},
    h('div', {class:'otw'}, hero.badge),
    h('h1', {class:'hname'},
      h('span', {class:'f'}, hero.firstName),
      h('span', {class:'l'}, hero.lastName)
    ),
    h('p', {class:'hsub'}, h('strong', {style:{color:'var(--text)',fontWeight:600}}, hero.title), ' · ' + hero.subtitle),
    h('div', {class:'htags'}, ...hero.tags.map(t => Tag(t))),
    h('div', {class:'hbtns'},
      h('a', {class:'btn1', href:`mailto:${contact.email}`}, 'Get In Touch'),
      h('a', {class:'btn2', href:'#projects'}, 'View Projects ', h('span',{},'→'))
    ),
    stats
  );

  // Right cards
  const roleCard = h('div', {class:'ic'},
    h('div', {class:'lbl'}, cards.role.label),
    h('div', {class:'ic-head'},
      h('div', {class:'ic-icon'}, cards.role.icon),
      h('div', {},
        h('div', {class:'ic-title'}, cards.role.title),
        h('div', {class:'ic-meta'}, cards.role.meta)
      )
    )
  );

  const clientCard = h('div', {class:'ic'},
    h('div', {class:'lbl'}, cards.client.label),
    h('div', {class:'ic-head'},
      h('div', {class:'ic-icon'}, cards.client.icon),
      h('div', {},
        h('div', {class:'ic-title', style:{color:cards.client.titleColor}}, cards.client.title),
        h('div', {class:'ic-meta'}, cards.client.meta)
      )
    )
  );

  const stackCard = h('div', {class:'ic'},
    h('div', {class:'lbl'}, cards.stack.label),
    h('div', {class:'stags'}, ...cards.stack.tags.map(t => Tag(t, true)))
  );

  const uaeCard = h('div', {class:'ic uae'},
    h('div', {class:'uae-inner'},
      h('div', {class:'uae-fc'}, cards.uae.flag),
      h('div', {},
        h('div', {class:'uae-t'}, cards.uae.title),
        h('div', {class:'uae-s'}, cards.uae.sub)
      )
    )
  );

  const right = h('div', {class:'hright fade3'}, roleCard, clientCard, stackCard, uaeCard);
  return h('div', {class:'hgrid'}, left, right);
}

function About() {
  return h('section', {class:'sec fade4', id:'about'},
    h('div', {class:'sec-hd'},
      h('h2', {class:'sec-t'}, 'About'),
      h('div', {class:'sec-line'})
    ),
    h('div', {class:'about-c'},
      h('p', {class:'about-txt', html: DATA.summary})
    )
  );
}

function Skills() {
  const cards = DATA.skills.map(s =>
    h('div', {class:'sk'},
      h('div', {class:'sk-cat'}, s.cat),
      h('div', {class:'sk-tags'}, ...s.items.map(i => Tag(i)))
    )
  );
  return h('section', {class:'sec fade4', id:'skills'},
    h('div', {class:'sec-hd'},
      h('h2', {class:'sec-t'}, 'Technical Skills'),
      h('div', {class:'sec-line'})
    ),
    h('div', {class:'skills-g'}, ...cards)
  );
}

function Experience() {
  const cards = DATA.experience.map(e => {
    const card = h('div', {class:'exp'},
      h('div', {class:'exp-hd'},
        h('div', {},
          h('div', {class:'exp-co'}, e.company),
          h('div', {class:'exp-role'}, e.role)
        ),
        h('div', {class:'exp-meta'},
          h('div', {class:'exp-per'}, e.period),
          h('div', {class:'exp-loc'}, e.location)
        )
      )
    );
    if (e.client) card.appendChild(h('div', {class:'exp-cl'}, '🏦 Client: ' + e.client));
    card.appendChild(h('ul', {class:'exp-ul'}, ...e.highlights.map(hl => h('li', {}, hl))));
    card.appendChild(h('div', {class:'exp-st'}, ...e.stack.map(s => Tag(s))));
    return card;
  });

  return h('section', {class:'sec fade5', id:'experience'},
    h('div', {class:'sec-hd'},
      h('h2', {class:'sec-t'}, 'Experience'),
      h('div', {class:'sec-line'})
    ),
    h('div', {class:'exp-list'}, ...cards)
  );
}

function Projects() {
  const cards = DATA.projects.map(p => {
    const card = h('div', {class:'proj', style:{'--dc': p.color+'18'}});
    const domBadge = h('span', {
      class:'proj-dom',
      style:{ color:p.color, background:p.color+'18', border:`1px solid ${p.color}30` }
    }, p.domain);
    card.appendChild(h('div', {class:'proj-top'},
      h('div', {},
        h('div', {class:'proj-title'}, p.title),
        h('div', {class:'proj-cl'}, p.client)
      ),
      domBadge
    ));
    card.appendChild(h('p', {class:'proj-desc'}, p.desc));
    card.appendChild(h('ul', {class:'proj-hl'}, ...p.highlights.map(hl => h('li',{},hl))));
    card.appendChild(h('div', {class:'proj-st'}, ...p.stack.map(s => Tag(s))));
    return card;
  });

  return h('section', {class:'sec fade6', id:'projects'},
    h('div', {class:'sec-hd'},
      h('h2', {class:'sec-t'}, 'Key Projects'),
      h('div', {class:'sec-line'})
    ),
    h('div', {class:'proj-g'}, ...cards)
  );
}

function ContactSection() {
  const { contact } = DATA;
  const svgEmail = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`;
  const svgPhone = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.5 19.79 19.79 0 0 1 1.61 4.9 2 2 0 0 1 3.58 2.72h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 10.09a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
  const svgLI = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`;

  const emailLink = h('a', {class:'clink', href:`mailto:${contact.email}`});
  emailLink.innerHTML = svgEmail + contact.email;

  const phoneLink = h('a', {class:'clink', href:`tel:${contact.phone.replace(/\s/g,'')}`});
  phoneLink.innerHTML = svgPhone + contact.phone;

  const liLink = h('a', {class:'clink', href:contact.linkedin, target:'_blank', rel:'noopener noreferrer'});
  liLink.innerHTML = svgLI + 'LinkedIn';

  return h('section', {class:'contact fade7', id:'contact'},
    h('h2', {class:'contact-t', html:'Let\'s <span>Work Together</span>'}),
    h('p', {class:'contact-s'}, 'Available for UAE / Dubai opportunities · Open to visa sponsorship & relocation'),
    h('div', {class:'clinks'}, emailLink, phoneLink, liLink)
  );
}

function Footer() {
  return h('footer', {},
    h('span', {}, '© 2025 Surya Sundar · Built with Vite + React'),
    h('span', {}, 'Bengaluru, India · Open to UAE 🇦🇪')
  );
}

// Mount
const app = document.getElementById('app');
[Nav(), Hero(), About(), Skills(), Experience(), Projects(), ContactSection(), Footer()]
  .forEach(el => app.appendChild(el));

// Intersection Observer for scroll animations
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.style.opacity = '1';
      e.target.style.transform = 'translateY(0)';
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll('.sec, .contact').forEach(el => {
  el.style.opacity = '0';
  el.style.transform = 'translateY(24px)';
  el.style.transition = 'opacity .6s ease, transform .6s ease';
  observer.observe(el);
});
</script>
